services:
  app:
    build: .
    environment:
      - DATABASE_URL=postgres://osusowake:${POSTGRES_PASSWORD:-osusowake_pass}@db:5432/osusowake
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-https://osusowake.city}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=osusowake
      - POSTGRES_USER=osusowake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-osusowake_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osusowake"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./data/uploads:/var/www/uploads:ro
      - ./data/certs:/etc/letsencrypt:ro
      - ./data/certbot-webroot:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
