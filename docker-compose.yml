services:
  app:
    build: .
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - DATABASE_URL=postgres://osusowake:${POSTGRES_PASSWORD:-osusowake_pass}@db:5432/osusowake
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-https://osusowake.city}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=osusowake
      - POSTGRES_USER=osusowake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-osusowake_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osusowake"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
